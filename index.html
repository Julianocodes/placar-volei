<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Placar de Vôlei</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d1321">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Placar">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d1321;
    --panel: #1a2236;
    --panel-2: #222c44;
    --text: #f1f4fa;
    --muted: #8b96ad;
    --a: #ff7a1a;
    --b: #2ec4b6;
    --gold: #ffd166;
    --danger: #ef476f;
    --radius: 18px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  /* Tela travada: sem scroll, sem "puxar para atualizar", sem zoom no toque duplo */
  html, body {
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
  }
  body {
    font-family: "Inter", system-ui, sans-serif;
    background: radial-gradient(circle at 50% -20%, #22305a 0%, var(--bg) 60%);
    color: var(--text);
  }
  .app {
    height: 100vh;
    height: 100dvh;
    display: flex; flex-direction: column; gap: 10px;
    padding: calc(10px + env(safe-area-inset-top)) calc(10px + env(safe-area-inset-right))
             calc(10px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left));
    max-width: 900px; margin: 0 auto;
  }

  button { font-family: inherit; cursor: pointer; border: none; color: inherit; }

  /* Barra de cima */
  .top-bar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; }
  .top-bar .gear { justify-self: end; }
  .info { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; flex: 1; }
  .chip {
    display: flex; align-items: center; gap: 6px; max-width: 100%;
    background: var(--panel); border: 2px solid transparent; border-radius: 999px;
    padding: 4px 10px; font-size: .85rem; color: var(--muted);
  }
  .chip .chip-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 9em; }
  .chip strong { color: var(--gold); font-size: 1rem; }
  .chip.playing { color: var(--text); }
  .gear {
    width: 42px; height: 42px; border-radius: 12px; background: var(--panel);
    font-size: 1.3rem; display: grid; place-items: center;
  }
  .gear:active { transform: scale(.94); }

  .timer {
    background: var(--panel); border-radius: 12px; padding: 6px 12px; white-space: nowrap;
    font-family: "Bebas Neue", sans-serif; font-size: 1.5rem; letter-spacing: 1px; color: var(--text);
  }
  .timer.parado { color: var(--muted); }
  .timer-box { display: flex; align-items: center; gap: 6px; }
  .play {
    width: 42px; height: 42px; border-radius: 12px; background: #1f9d55; color: #fff;
    font-size: 1.1rem; display: grid; place-items: center;
  }
  .play.rodando { background: var(--danger); }
  .play:active { transform: scale(.94); }

  /* Quadra: ocupa todo o resto da tela */
  .court { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 10px; }

  /* Pódio entre os cards */
  .podium {
    width: 150px; background: var(--panel); border-radius: var(--radius); padding: 10px 8px;
    display: flex; flex-direction: column; justify-content: center; gap: 8px;
  }
  .podium h4 { text-align: center; font-size: .75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
  .place {
    background: var(--panel-2); border-radius: 12px; padding: 8px; display: flex; align-items: center; gap: 8px;
    border-left: 4px solid var(--pc, #33405f);
  }
  .place .pos { font-size: 1.3rem; line-height: 1; min-width: 26px; text-align: center; }
  .place .pos small { font-size: .8rem; color: var(--muted); font-weight: 700; }
  .place .who { min-width: 0; display: flex; flex-direction: column; }
  .place .who span { font-size: .78rem; font-weight: 600; line-height: 1.15; overflow: hidden;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; word-break: break-word; }
  .place .who b { font-size: .75rem; color: var(--gold); }
  .place.first { background: rgba(255,209,102,.12); }
  .team-card {
    background: var(--panel); border-radius: var(--radius); padding: 16px 10px;
    display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    gap: 8px; min-height: 0;
    border-top: 10px solid var(--color);
  }
  .team-card.a { --color: var(--a); }
  .team-card.b { --color: var(--b); }
  .team-head { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; }
  .team-name {
    background: transparent; border: 2px dashed transparent; color: var(--text);
    font-family: inherit; font-weight: 700; font-size: 1.45rem; text-align: center;
    width: 100%; min-width: 0; padding: 4px 6px; border-radius: 8px; user-select: text; -webkit-user-select: text;
  }
  .team-name:focus { outline: none; border-color: var(--color); background: var(--panel-2); }
  .sets-badge {
    font-size: .85rem; color: var(--gold); background: rgba(255,209,102,.12);
    padding: 4px 10px; border-radius: 999px; font-weight: 600;
  }
  .points {
    font-family: "Bebas Neue", sans-serif; font-size: clamp(5rem, 26vw, 9rem);
    line-height: .9; color: var(--color);
  }
  .points.bump { animation: bump .25s; }
  @keyframes bump { 50% { transform: scale(1.12); } }
  .controls { display: flex; gap: 8px; width: 100%; }
  .controls button {
    flex: 1; height: 80px; border-radius: 16px; font-size: 2.6rem; font-weight: 700;
    transition: transform .08s, filter .2s;
  }
  .controls button:active { transform: scale(.94); }
  .minus { background: var(--panel-2); }
  .plus { background: var(--color); color: #10151f; }

  /* Painel de configurações (abre por cima) */
  .sheet-bg {
    position: fixed; inset: 0; background: rgba(5,8,15,.7); display: none; z-index: 5;
    align-items: flex-end; justify-content: center;
  }
  .sheet-bg.show { display: flex; animation: fade .2s; }
  .sheet {
    background: var(--panel); width: 100%; max-width: 560px; max-height: 88dvh;
    border-radius: 24px 24px 0 0; padding: 18px 18px calc(18px + env(safe-area-inset-bottom));
    overflow-y: auto; overscroll-behavior: contain;
    display: flex; flex-direction: column; gap: 16px;
    animation: up .25s;
  }
  @keyframes up { from { transform: translateY(40px); opacity: 0; } }
  .sheet-head { display: flex; justify-content: space-between; align-items: center; }
  .sheet-head h2 { font-size: 1.1rem; }
  .close { width: 38px; height: 38px; border-radius: 10px; background: var(--panel-2); font-size: 1.1rem; }
  .section-title { font-size: .8rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .row label { font-weight: 600; }
  .stepper { display: flex; align-items: center; gap: 8px; }
  .stepper button { width: 40px; height: 40px; border-radius: 10px; background: var(--panel-2); font-size: 1.2rem; font-weight: 700; }
  .stepper button:disabled { opacity: .35; }
  .stepper span { min-width: 36px; text-align: center; font-family: "Bebas Neue", sans-serif; font-size: 1.7rem; }
  .presets { display: flex; gap: 6px; }
  .presets button { padding: 6px 12px; border-radius: 8px; background: var(--panel-2); color: var(--muted); font-weight: 600; }
  .presets button.active { background: var(--gold); color: #10151f; }
  .hint { color: var(--muted); font-size: .8rem; }
  .cfg-top { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 10px; }
  .cfg-box {
    background: var(--panel-2); border-radius: 14px; padding: 10px 12px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .cfg-box label { font-weight: 600; }
  .cfg-box .stepper button { background: var(--panel); }
  .names-list { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 10px; }
  .names-list .name-row {
    position: relative; display: flex; align-items: center;
    background: var(--panel-2); border-radius: 14px; border-left: 6px solid var(--tc, #33405f);
  }
  .names-list input {
    flex: 1; min-width: 0; background: transparent; border: 2px solid transparent; color: var(--text);
    padding: 12px 10px; border-radius: 12px; font-family: inherit; font-size: 1rem;
    user-select: text; -webkit-user-select: text;
  }
  .names-list .tag { margin-right: 10px; }
  .names-list input:focus { outline: none; }
  .names-list .name-row:focus-within { box-shadow: 0 0 0 2px var(--gold); }
  @media (max-width: 520px) {
    .cfg-top, .names-list { grid-template-columns: 1fr; }
  }
  .tag { font-size: .75rem; padding: 4px 8px; border-radius: 999px; background: #33405f; color: var(--muted); white-space: nowrap; }
  .tag.playing { background: rgba(46,196,182,.15); color: var(--b); }
  .btn {
    background: var(--panel-2); padding: 12px 14px; border-radius: 12px; font-weight: 600; font-size: .95rem;
  }
  .btn.danger { color: var(--danger); }
  .btn.primary { background: var(--gold); color: #10151f; }

  /* Botão de sorteio na barra de cima */
  .draw-open {
    justify-self: start; background: var(--panel); border-radius: 12px; padding: 0 14px; height: 42px;
    font-weight: 700; font-size: .95rem;
  }
  .draw-open:active { transform: scale(.96); }

  /* Jogadores do time no card */
  .roster {
    font-size: .8rem; color: var(--muted); text-align: center; width: 100%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-height: 1em;
  }

  /* Tela de sorteio */
  .draw-bg {
    position: fixed; inset: 0; z-index: 7; display: none; flex-direction: column; gap: 10px;
    background: var(--bg);
    padding: calc(10px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right))
             calc(10px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));
  }
  .draw-bg.show { display: flex; animation: fade .2s; }
  .draw-head { display: flex; align-items: center; justify-content: space-between; }
  .draw-head h2 { font-size: 1.1rem; color: var(--gold); }
  .draw-actions { display: flex; gap: 8px; }
  .opt { background: var(--panel); color: var(--muted); border-radius: 999px; padding: 0 14px; height: 38px; font-weight: 600; }
  .draw-grid { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 10px; }
  .dpanel { background: var(--panel); border-radius: 14px; padding: 10px; overflow-y: auto; overscroll-behavior: contain; }
  .dlb { display: flex; justify-content: space-between; font-size: .8rem; color: var(--muted); margin-bottom: 8px; }
  .dadd { display: flex; gap: 6px; margin-bottom: 8px; }
  .dadd input {
    flex: 1; min-width: 0; height: 40px; background: var(--panel-2); border: 2px solid transparent; color: var(--text);
    border-radius: 10px; padding: 0 12px; font-family: inherit; font-size: 1rem; user-select: text; -webkit-user-select: text;
  }
  .dadd input:focus { outline: none; border-color: var(--gold); }
  .dadd button { background: var(--gold); color: #10151f; border-radius: 10px; padding: 0 14px; font-weight: 700; white-space: nowrap; }
  .dlist { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 6px; }
  .dp { display: flex; align-items: center; gap: 6px; background: var(--panel-2); border-radius: 10px; padding: 8px 6px 8px 10px; font-size: .9rem; min-width: 0; }
  .dp .n { color: var(--muted); font-size: .75rem; min-width: 16px; }
  .dp .nm, .dl .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dp .x { background: transparent; color: var(--muted); width: 26px; height: 26px; border-radius: 8px; font-size: 1.1rem; }
  .dlvl { display: flex; flex-direction: column; gap: 6px; }
  .dl { display: flex; align-items: center; gap: 8px; background: var(--panel-2); border-radius: 10px; padding: 5px 6px 5px 12px; font-size: .95rem; }
  .seg { display: flex; gap: 3px; background: #141b2c; border-radius: 10px; padding: 3px; }
  .seg button { background: transparent; padding: 7px 10px; border-radius: 8px; font-size: .8rem; color: var(--muted); border: 1.5px solid transparent; }
  .seg button.l1.on { background: #3d4b6b; color: #fff; border-color: #8b96ad; }
  .seg button.l2.on { background: var(--b); color: #04342c; border-color: #9ff0e6; font-weight: 700; }
  .seg button.l3.on { background: var(--gold); color: #3b2a00; border-color: #fff1c2; font-weight: 700; }
  .drow { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; font-weight: 600; }
  .dgo { width: 100%; background: var(--b); color: #04342c; border-radius: 12px; padding: 12px 0; font-weight: 700; font-size: 1rem; }
  .dgo:active, .dadd button:active { transform: scale(.97); }
  .dempty { color: var(--muted); font-size: .85rem; text-align: center; padding: 18px 4px; }
  .dteams { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 6px; margin-top: 10px; }
  .dteam { background: var(--panel-2); border-radius: 10px; border-top: 5px solid var(--c); padding: 7px 8px; }
  .dteam h4 { font-size: .85rem; color: var(--c); margin-bottom: 4px; }
  .dteam ol { padding-left: 18px; font-size: .85rem; line-height: 1.6; }
  .dteam li { animation: entra .35s both; }
  @keyframes entra { from { opacity: 0; transform: translateY(6px); } }
  .dbal { display: none; font-size: .7rem; color: var(--gold); margin-top: 4px; }
  .draw-bg.org .dbal { display: block; }
  .dleft { font-size: .8rem; color: var(--muted); margin-top: 6px; }
  .duse { width: 100%; margin-top: 8px; background: var(--gold); color: #10151f; border-radius: 12px; padding: 11px 0; font-weight: 700; }
  .dagain { width: 100%; margin-top: 6px; background: var(--panel-2); border-radius: 12px; padding: 10px 0; font-weight: 600; }

  /* Pódio clicável */
  .podium { cursor: pointer; }
  .podium:active { transform: scale(.97); }
  .podium .ver { text-align: center; font-size: .7rem; color: var(--muted); }

  /* Ranking em tela cheia */
  .rank-bg {
    position: fixed; inset: 0; z-index: 8; display: none; flex-direction: column;
    background: radial-gradient(circle at 50% 35%, #2b2a4a 0%, #0d1321 65%);
    padding: calc(10px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right))
             calc(10px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
    overflow: hidden;
  }
  .rank-bg.show { display: flex; animation: fade .25s; }
  .rank-head { display: flex; justify-content: space-between; align-items: center; position: relative; z-index: 1; }
  .rank-head h2 { font-family: "Bebas Neue", sans-serif; font-weight: 400; font-size: 2rem; letter-spacing: 2px; color: var(--gold); }
  .stage {
    flex: 1; min-height: 0; display: flex; align-items: flex-end; justify-content: center; gap: 14px;
    position: relative; z-index: 1;
  }
  .step { width: min(28%, 220px); display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .step .medal { font-size: 2.2rem; line-height: 1; }
  .step .nome { font-weight: 700; text-align: center; font-size: 1rem; line-height: 1.15;
    max-width: 100%; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .step .qtd { color: var(--gold); font-weight: 700; font-size: .9rem; }
  .step .bloco {
    width: 100%; border-radius: 14px 14px 0 0; display: grid; place-items: center;
    background: var(--c); color: #10151f; font-family: "Bebas Neue", sans-serif; font-size: 3rem;
    animation: sobe .6s cubic-bezier(.2,.9,.3,1.2) both;
  }
  .step.p1 .bloco { height: 42vh; animation-delay: .35s; }
  .step.p2 .bloco { height: 30vh; animation-delay: .15s; }
  .step.p3 .bloco { height: 21vh; animation-delay: 0s; }
  .step.p1 .medal { font-size: 3.2rem; filter: drop-shadow(0 0 14px rgba(255,209,102,.8)); animation: brilho 1.6s ease-in-out infinite; }
  .step.p1 .nome { font-size: 1.2rem; color: var(--gold); }
  @keyframes sobe { from { transform: scaleY(0); transform-origin: bottom; } to { transform: scaleY(1); transform-origin: bottom; } }
  @keyframes brilho { 50% { transform: scale(1.12) rotate(-6deg); } }
  .rank-rest { display: flex; justify-content: center; gap: 8px; margin-top: 8px; position: relative; z-index: 1; }
  .rank-rest .tag { font-size: .8rem; padding: 4px 10px; }
  .confetes { position: absolute; inset: 0; pointer-events: none; z-index: 0; opacity: .7; }
  .confetes i {
    position: absolute; top: -10px; width: 8px; height: 12px; border-radius: 2px; opacity: .9;
    animation: cai linear infinite;
  }
  @keyframes cai { to { transform: translateY(110vh) rotate(540deg); } }

  /* Aviso de fim de set */
  .overlay {
    position: fixed; inset: 0; background: rgba(5,8,15,.82); display: none;
    align-items: center; justify-content: center; padding: 20px; z-index: 10;
  }
  .overlay.show { display: flex; animation: fade .25s; }
  @keyframes fade { from { opacity: 0; } }
  .modal {
    background: var(--panel); border-radius: 24px; padding: 28px 22px; max-width: 420px; width: 100%;
    text-align: center; display: flex; flex-direction: column; gap: 12px; border: 2px solid var(--gold);
  }
  .modal .ball { font-size: 3rem; }
  .modal h3 { font-family: "Bebas Neue", sans-serif; font-size: 2.2rem; font-weight: 400; color: var(--gold); letter-spacing: 1px; }
  .modal p { color: var(--muted); }
  .modal .swap { background: var(--panel-2); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
  .modal .swap b { color: var(--text); }
  .modal .actions { display: flex; gap: 8px; margin-top: 6px; }
  .modal .actions .btn { flex: 1; }

  @media (orientation: portrait) {
    .court { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
    .podium { display: none; }
  }

  /* Celular deitado: tudo mais compacto para caber sem scroll */
  @media (orientation: landscape) and (max-height: 520px) {
    .app { gap: 6px; padding-top: calc(6px + env(safe-area-inset-top)); padding-bottom: calc(6px + env(safe-area-inset-bottom)); }
    .top-bar .gear { width: 36px; height: 36px; font-size: 1.1rem; }
    .info { font-size: .8rem; }
    .court { gap: 8px; }
    .team-card { padding: 8px 10px; gap: 4px; border-top-width: 9px; }
    .team-head { flex-direction: column; gap: 2px; }
    .team-name { font-size: 1.4rem; padding: 2px 6px; }
    .chip { padding: 2px 10px; font-size: .8rem; }
    .points { font-size: clamp(3.5rem, 30vh, 8rem); }
    .controls button { height: 56px; font-size: 2.2rem; }
    .sheet { max-height: 94dvh; border-radius: 20px 20px 0 0; max-width: 760px; }
    .timer { font-size: 1.25rem; padding: 3px 10px; }
    .play { width: 36px; height: 36px; font-size: 1rem; }
    .podium { width: 140px; padding: 8px 6px; gap: 6px; }
    .place { padding: 6px; }
  }

  /* Telas largas (tablet/PC): cards não ficam gigantes */
  @media (min-width: 700px) {
    .points { font-size: 9rem; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="top-bar">
    <button class="draw-open" id="btnDraw" aria-label="Sortear times">🎲 Sortear</button>
    <div class="timer-box">
      <div class="timer parado" id="timer">00:00</div>
      <button class="play" id="btnPlay" aria-label="Iniciar cronômetro">▶</button>
    </div>
    <button class="gear" id="btnSettings" aria-label="Configurações">⚙️</button>
  </div>

  <section class="court">
    <div class="team-card a" data-side="0">
      <div class="team-head">
        <input class="team-name" aria-label="Nome do time da esquerda">
        <div class="roster"></div>
      </div>
      <div class="points">0</div>
      <div class="controls">
        <button class="minus" aria-label="Remover ponto">−</button>
        <button class="plus" aria-label="Adicionar ponto">+</button>
      </div>
    </div>
    <div class="podium">
      <h4>Pódio</h4>
      <div id="podiumList" style="display:flex;flex-direction:column;gap:6px"></div>
      <div class="ver">toque para ver o ranking</div>
    </div>
    <div class="team-card b" data-side="1">
      <div class="team-head">
        <input class="team-name" aria-label="Nome do time da direita">
        <div class="roster"></div>
      </div>
      <div class="points">0</div>
      <div class="controls">
        <button class="minus" aria-label="Remover ponto">−</button>
        <button class="plus" aria-label="Adicionar ponto">+</button>
      </div>
    </div>
  </section>
</div>

<!-- Configurações -->
<div class="sheet-bg" id="sheetBg">
  <div class="sheet" role="dialog" aria-label="Configurações">
    <div class="sheet-head">
      <h2>⚙️ Configurações</h2>
      <button class="close" id="btnClose" aria-label="Fechar">✕</button>
    </div>

    <div class="cfg-top">
      <div class="cfg-box">
        <label>Pontos por set</label>
        <div class="stepper">
          <button id="targetMinus">−</button>
          <span id="targetValue">15</span>
          <button id="targetPlus">+</button>
        </div>
      </div>
      <div class="cfg-box">
        <label>Times</label>
        <div class="stepper">
          <button id="teamsMinus">−</button>
          <span id="teamsValue">4</span>
          <button id="teamsPlus">+</button>
        </div>
      </div>
    </div>

    <div class="names-list" id="namesList"></div>

    <button class="btn danger" id="btnResetAll">Recomeçar tudo (zera pontos e sets)</button>
  </div>
</div>

<!-- Sorteio de times -->
<div class="draw-bg" id="drawBg">
  <div class="draw-head">
    <h2>🎲 Sorteio de times</h2>
    <div class="draw-actions">
      <button class="opt" id="btnOpt">⋯ Opções</button>
      <button class="close" id="btnDrawClose" aria-label="Fechar">✕</button>
    </div>
  </div>
  <div class="draw-grid">
    <div class="dpanel">
      <div id="drawNormal">
        <div class="dlb"><span>Jogadores</span><span id="dCount"></span></div>
        <div class="dadd">
          <input id="dName" placeholder="Nome do jogador" maxlength="16">
          <button id="dAdd">+ Adicionar</button>
        </div>
        <div class="dlist" id="dList"></div>
      </div>
      <div id="drawOrg" hidden>
        <div class="dlb"><span>Nível de cada jogador</span></div>
        <div class="dlvl" id="dLvl"></div>
      </div>
    </div>
    <div class="dpanel">
      <div class="drow">
        <label>Jogadores por time</label>
        <div class="stepper">
          <button id="perMinus">−</button>
          <span id="perValue">5</span>
          <button id="perPlus">+</button>
        </div>
      </div>
      <button class="dgo" id="dGo">🔀 Sortear times</button>
      <div id="dRes"><div class="dempty">Os times aparecem aqui.</div></div>

  </div>
</div>

<!-- Ranking (abre ao tocar no pódio) -->
<div class="rank-bg" id="rankBg">
  <div class="confetes" aria-hidden="true"></div>
  <div class="rank-head">
    <h2>🏆 Ranking</h2>
    <button class="close" id="btnRankClose" aria-label="Fechar">✕</button>
  </div>
  <div class="stage" id="stage"></div>
  <div class="rank-rest" id="rankRest"></div>
</div>

<!-- Aviso de fim de set -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="ball">🏆</div>
    <h3 id="winTitle"></h3>
    <p id="winScore"></p>
    <div class="swap" id="winSwap"></div>
    <div class="actions">
      <button class="btn" id="btnWinUndo">Desfazer</button>
      <button class="btn primary" id="btnWinOk">Próximo jogo ▶</button>
    </div>
  </div>
</div>

<script>
  const MAX_TEAMS = 4;
  const MIN_TEAMS = 2;
  const STORAGE_KEY = "placar-volei-v1";
  // uma cor para cada time: Time 1, Time 2, Time 3, Time 4
  const TEAM_COLORS = ["#ff7a1a", "#2ec4b6", "#9b6bff", "#ff4f8b"];

  // ===== Estado =====
  // teams: todos os times cadastrados
  // court: ids dos 2 times em quadra [esquerda, direita]
  // points: pontos de cada lado [esquerda, direita]
  // queue: ids dos times esperando, em ordem
  function defaultState() {
    return {
      teams: [1, 2, 3, 4].map(id => ({ id, name: "Time " + id, sets: 0 })),
      nextId: 5,
      court: [1, 2],
      points: [0, 0],
      queue: [3, 4],
      target: 15,
      games: 0,
      clock: { elapsed: 0, since: null }
    };
  }

  let state = load() || defaultState();
  let history = [];

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }
  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
  }
  function snapshot() {
    history.push(JSON.stringify(state));
    if (history.length > 50) history.shift();
  }
  function undo() {
    if (!history.length) return;
    state = JSON.parse(history.pop());
    hideOverlay();
    render();
  }

  const team = id => state.teams.find(t => t.id === id);
  const colorOf = id => TEAM_COLORS[state.teams.findIndex(t => t.id === id) % TEAM_COLORS.length];

  // ===== Regras do jogo =====
  function isSetOver() {
    const [a, b] = state.points;
    if (Math.max(a, b) < state.target) return false;
    return Math.abs(a - b) >= 2; // sempre diferença de 2
  }

  function addPoint(side) {
    snapshot();
    state.points[side]++;
    bump(side);
    if (isSetOver()) finishSet(side);
    render();
  }

  function removePoint(side) {
    if (state.points[side] === 0) return;
    snapshot();
    state.points[side]--;
    render();
  }

  function finishSet(winnerSide) {
    const loserSide = winnerSide === 0 ? 1 : 0;
    const winner = team(state.court[winnerSide]);
    const loser = team(state.court[loserSide]);
    const finalScore = [...state.points];

    winner.sets++;
    state.games++;

    let incoming = null;
    if (state.queue.length > 0) {
      // perdedor vai pro fim da fila, o primeiro da fila entra no lugar dele
      state.queue.push(loser.id);
      incoming = team(state.queue.shift());
      state.court[loserSide] = incoming.id; // quem entra fica no lugar do perdedor
    }
    state.points = [0, 0];

    showOverlay(winner, loser, incoming, finalScore, winnerSide);
  }

  function setTeamCount(n) {
    if (n < MIN_TEAMS || n > MAX_TEAMS || n === state.teams.length) return;
    snapshot();
    if (n > state.teams.length) {
      const id = state.nextId++;
      state.teams.push({ id, name: "Time " + id, sets: 0 });
      state.queue.push(id);
    } else {
      const removed = state.teams.pop();
      state.queue = state.queue.filter(id => id !== removed.id);
      const side = state.court.indexOf(removed.id);
      if (side !== -1) {
        state.court[side] = state.queue.shift();
        state.points = [0, 0];
      }
    }
    render();
  }

  function rename(id, name) {
    const t = team(id);
    t.name = name.trim() || "Time " + id;
    save();
    renderTexts();
  }

  function setTarget(v) {
    v = Math.max(1, Math.min(99, v));
    if (v === state.target) return;
    snapshot();
    state.target = v;
    if (isSetOver()) finishSet(state.points[0] > state.points[1] ? 0 : 1);
    render();
  }

  // ===== Aviso de fim de set =====
  const overlay = document.getElementById("overlay");
  function showOverlay(winner, loser, incoming, score, winnerSide) {
    closeSettings();
    document.getElementById("winTitle").textContent = winner.name + " venceu o set!";
    const s = winnerSide === 0 ? score : [score[1], score[0]];
    document.getElementById("winScore").textContent =
      `${s[0]} × ${s[1]} · ${winner.name} agora tem ${setsLabel(winner.sets)}`;
    const swap = document.getElementById("winSwap");
    swap.innerHTML = "";
    if (incoming) {
      swap.append(line("⬅️ Sai: ", loser.name, ` (${setsLabel(loser.sets)})`));
      swap.append(line("➡️ Entra: ", incoming.name, ` (${setsLabel(incoming.sets)})`));
    } else {
      swap.append(line("", "Os mesmos dois", " jogam de novo."));
    }
    overlay.classList.add("show");
  }
  function line(prefix, bold, suffix) {
    const div = document.createElement("div");
    const b = document.createElement("b");
    b.textContent = bold;
    div.append(prefix, b, suffix);
    return div;
  }
  function hideOverlay() { overlay.classList.remove("show"); }

  // ===== Sorteio de times =====
  // players: [{ name, level }]  level: 1 iniciante, 2 médio, 3 forte (só aparece em "Opções")
  if (!state.players) state.players = [];
  if (!state.perTeam) state.perTeam = 5;
  const drawBg = document.getElementById("drawBg");
  const NIVEIS = ["Iniciante", "Médio", "Forte"];
  let orgMode = false;
  let lastDraw = null;

  const shuffle = arr => {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  };

  function renderDraw() {
    document.getElementById("dCount").textContent = state.players.length + " na lista";
    document.getElementById("perValue").textContent = state.perTeam;

    const list = document.getElementById("dList");
    list.innerHTML = "";
    state.players.forEach((p, i) => {
      const row = document.createElement("div");
      row.className = "dp";
      const n = document.createElement("span");
      n.className = "n";
      n.textContent = i + 1;
      const nm = document.createElement("span");
      nm.className = "nm";
      nm.textContent = p.name;
      const x = document.createElement("button");
      x.className = "x";
      x.textContent = "×";
      x.setAttribute("aria-label", "Remover " + p.name);
      x.addEventListener("click", () => { state.players.splice(i, 1); save(); renderDraw(); });
      row.append(n, nm, x);
      list.append(row);
    });

    const lvl = document.getElementById("dLvl");
    lvl.innerHTML = "";
    state.players.forEach(p => {
      const row = document.createElement("div");
      row.className = "dl";
      const nm = document.createElement("span");
      nm.className = "nm";
      nm.textContent = p.name;
      const seg = document.createElement("div");
      seg.className = "seg";
      NIVEIS.forEach((txt, k) => {
        const b = document.createElement("button");
        b.textContent = txt;
        b.className = "l" + (k + 1) + (p.level === k + 1 ? " on" : "");
        b.addEventListener("click", () => { p.level = k + 1; save(); renderDraw(); });
        seg.append(b);
      });
      row.append(nm, seg);
      lvl.append(row);
    });
  }

  function addPlayer() {
    const input = document.getElementById("dName");
    const name = input.value.trim();
    if (!name) return;
    state.players.push({ name, level: 2 }); // entra como médio
    input.value = "";
    save();
    renderDraw();
    input.focus();
  }

  // 1) conta quantos times dá pra montar, contando o time incompleto se tiver pelo menos metade (ex.: 14 jogadores, 5 por time = 3 times: 5, 5 e 4)
  // 2) se passar do limite de times, quem fica de fora é sorteado ao acaso (não sobra só iniciante)
  // 3) distribui por nível em rodadas: fortes, depois médios, depois iniciantes
  function sortearTimes() {
    const per = state.perTeam;
    const completos = Math.floor(state.players.length / per);
    const resto = state.players.length % per;
    // time incompleto só vale se tiver pelo menos metade dos jogadores (senão vai pra próxima rodada)
    const n = Math.min(MAX_TEAMS, completos + (resto >= Math.ceil(per / 2) ? 1 : 0));
    const res = document.getElementById("dRes");
    res.innerHTML = "";
    if (state.players.length < per * 2) {
      res.innerHTML = '<div class="dempty"></div>';
      res.firstChild.textContent = "Precisa de pelo menos " + per * 2 + " jogadores.";
      lastDraw = null;
      return;
    }
    const times = Array.from({ length: n }, () => []);
    const vagas = n * per;
    // um forte "líder" garantido por time; o resto é sorteado (quem sobra vai pra próxima rodada)
    const fortes = shuffle(state.players.filter(p => p.level === 3));
    const lideres = fortes.slice(0, n);
    const outros = shuffle(state.players.filter(p => !lideres.includes(p)));
    const jogam = [...lideres, ...outros.slice(0, vagas - lideres.length)];
    const sobra = outros.slice(vagas - lideres.length);
    // vagas de cada time: todos completos, só o último pode ficar com menos
    const cap = times.map((t, k) => k < n - 1 ? per : jogam.length - per * (n - 1));
    // o time incompleto já conta com o forte que vai repetir (3 pontos por vaga faltando)
    const total = t => t.reduce((s, p) => s + p.level, 0) + (t === times[n - 1] ? 3 * (per - cap[n - 1]) : 0);
    const qtd = (t, l) => t.filter(p => p.level === l).length;
    [3, 2, 1].forEach(l => {
      jogam.filter(p => p.level === l).forEach(p => {
        const livres = times.filter((t, k) => t.length < cap[k]);
        livres.sort((a, b) => qtd(a, l) - qtd(b, l) || total(a) - total(b) || a.length - b.length || Math.random() - .5);
        livres[0].push(p);
      });
    });
    // time incompleto: completa com fortes sorteados dos outros times (eles jogam de novo)
    const faltam = per - times[n - 1].length;
    const repetem = faltam > 0
      ? shuffle(times.slice(0, n - 1).flat()).sort((a, b) => b.level - a.level).slice(0, faltam)
      : [];
    lastDraw = times.map(t => shuffle(t).map(p => p.name)); // ordem embaralhada: não entrega quem é forte
    repetem.forEach(p => lastDraw[n - 1].push(p.name + " ↺"));

    const grid = document.createElement("div");
    grid.className = "dteams";
    times.forEach((t, k) => {
      const box = document.createElement("div");
      box.className = "dteam";
      box.style.setProperty("--c", TEAM_COLORS[k]);
      const h = document.createElement("h4");
      h.textContent = (state.teams[k] ? state.teams[k].name : "Time " + (k + 1));
      const ol = document.createElement("ol");
      lastDraw[k].forEach((name, i) => {
        const li = document.createElement("li");
        li.textContent = name;
        li.style.animationDelay = (k * per + i) * 50 + "ms";
        ol.append(li);
      });
      const bal = document.createElement("div");
      bal.className = "dbal";
      const todosDoTime = k === n - 1 ? [...t, ...repetem] : t;
      bal.textContent = `${qtd(todosDoTime, 3)} forte · ${qtd(todosDoTime, 2)} médio · ${qtd(todosDoTime, 1)} inic.`
        + (k === n - 1 && repetem.length ? ` · ${repetem.length} repete ↺` : "");
      box.append(h, ol, bal);
      grid.append(box);
    });
    res.append(grid);
    if (sobra.length) {
      const l = document.createElement("div");
      l.className = "dleft";
      l.textContent = "Próxima rodada: " + sobra.map(p => p.name).join(", ");
      res.append(l);
    }
    const use = document.createElement("button");
    use.className = "duse";
    use.textContent = "▶ Usar no placar";
    use.addEventListener("click", usarNoPlacar);
    const again = document.createElement("button");
    again.className = "dagain";
    again.textContent = "🔀 Sortear de novo";
    again.addEventListener("click", sortearTimes);
    res.append(use, again);
  }

  // leva os times sorteados para o placar (começa um jogo novo)
  function usarNoPlacar() {
    if (!lastDraw) return;
    snapshot();
    const novos = lastDraw.map((players, k) => {
      const antigo = state.teams[k];
      const id = antigo ? antigo.id : state.nextId++;
      return { id, name: antigo ? antigo.name : "Time " + id, sets: 0, players };
    });
    state.teams = novos;
    state.court = [novos[0].id, novos[1].id];
    state.queue = novos.slice(2).map(t => t.id);
    state.points = [0, 0];
    state.games = 0;
    closeDraw();
    render();
  }

  function setOrg(on) {
    orgMode = on;
    drawBg.classList.toggle("org", on);
    document.getElementById("drawNormal").hidden = on;
    document.getElementById("drawOrg").hidden = !on;
    document.getElementById("btnOpt").textContent = on ? "✕ Fechar" : "⋯ Opções";
  }
  function openDraw() { setOrg(false); renderDraw(); drawBg.classList.add("show"); }
  function closeDraw() {
    if (document.activeElement) document.activeElement.blur();
    setOrg(false);
    drawBg.classList.remove("show");
  }

  document.getElementById("btnDraw").addEventListener("click", openDraw);
  document.getElementById("btnDrawClose").addEventListener("click", closeDraw);
  document.getElementById("btnOpt").addEventListener("click", () => setOrg(!orgMode));
  document.getElementById("dAdd").addEventListener("click", addPlayer);
  document.getElementById("dName").addEventListener("keydown", e => { if (e.key === "Enter") addPlayer(); });
  document.getElementById("dGo").addEventListener("click", sortearTimes);
  document.getElementById("perMinus").addEventListener("click", () => {
    if (state.perTeam > 1) { state.perTeam--; save(); renderDraw(); }
  });
  document.getElementById("perPlus").addEventListener("click", () => {
    if (state.perTeam < 9) { state.perTeam++; save(); renderDraw(); }
  });

  // ===== Ranking em tela cheia =====
  const rankBg = document.getElementById("rankBg");
  function rankingOrdenado() {
    return [...state.court, ...state.queue].map(team).sort((a, b) => b.sets - a.sets);
  }
  function openRanking() {
    const lista = rankingOrdenado();
    const stage = document.getElementById("stage");
    stage.innerHTML = "";
    // ordem na tela: 2º, 1º, 3º (pódio clássico)
    const medalhas = ["🏆", "🥈", "🥉"];
    [1, 0, 2].forEach(i => {
      const t = lista[i];
      if (!t) return;
      const step = document.createElement("div");
      step.className = "step p" + (i + 1);
      step.style.setProperty("--c", colorOf(t.id));
      const medal = document.createElement("div");
      medal.className = "medal";
      medal.textContent = medalhas[i];
      const nome = document.createElement("div");
      nome.className = "nome";
      nome.textContent = t.name;
      const qtd = document.createElement("div");
      qtd.className = "qtd";
      qtd.textContent = setsLabel(t.sets);
      const bloco = document.createElement("div");
      bloco.className = "bloco";
      bloco.textContent = (i + 1) + "º";
      step.append(medal, nome, qtd, bloco);
      stage.append(step);
    });
    const rest = document.getElementById("rankRest");
    rest.innerHTML = "";
    lista.slice(3).forEach((t, i) => {
      const tag = document.createElement("span");
      tag.className = "tag";
      tag.textContent = `${i + 4}º ${t.name} · ${setsLabel(t.sets)}`;
      rest.append(tag);
    });
    // confetes
    const conf = rankBg.querySelector(".confetes");
    conf.innerHTML = "";
    const cores = [...TEAM_COLORS, "#ffd166"];
    for (let k = 0; k < 40; k++) {
      const c = document.createElement("i");
      c.style.left = Math.random() * 100 + "%";
      c.style.background = cores[k % cores.length];
      c.style.animationDuration = 2.5 + Math.random() * 3 + "s";
      c.style.animationDelay = -Math.random() * 5 + "s";
      conf.append(c);
    }
    rankBg.classList.add("show");
  }
  function closeRanking() { rankBg.classList.remove("show"); }
  document.querySelector(".podium").addEventListener("click", openRanking);
  document.getElementById("btnRankClose").addEventListener("click", closeRanking);

  // ===== Configurações =====
  const sheetBg = document.getElementById("sheetBg");
  function openSettings() { renderTexts(); sheetBg.classList.add("show"); }
  function closeSettings() {
    if (document.activeElement) document.activeElement.blur();
    sheetBg.classList.remove("show");
  }

  // ===== Renderização =====
  const cards = document.querySelectorAll(".team-card");

  function bump(side) {
    const el = cards[side].querySelector(".points");
    el.classList.remove("bump");
    void el.offsetWidth;
    el.classList.add("bump");
  }

  function setsLabel(n) { return n + (n === 1 ? " set" : " sets"); }

  function renderTexts() {
    cards.forEach((card, side) => {
      const t = team(state.court[side]);
      card.style.setProperty("--color", colorOf(t.id));
      const input = card.querySelector(".team-name");
      if (document.activeElement !== input) input.value = t.name;
      card.querySelector(".roster").textContent = (t.players || []).join(" · ");
    });

    // pódio: os 3 com mais sets
    const podium = document.getElementById("podiumList");
    podium.innerHTML = "";
    const ranking = [...state.court, ...state.queue].map(team)
      .sort((a, b) => b.sets - a.sets).slice(0, 3);
    ranking.forEach((t, i) => {
      const place = document.createElement("div");
      place.className = "place" + (i === 0 ? " first" : "");
      place.style.setProperty("--pc", colorOf(t.id));
      const pos = document.createElement("div");
      pos.className = "pos";
      if (i === 0) pos.textContent = "🏆";
      else { const sm = document.createElement("small"); sm.textContent = (i + 1) + "º"; pos.append(sm); }
      const who = document.createElement("div");
      who.className = "who";
      const nm = document.createElement("span");
      nm.textContent = t.name;
      const st = document.createElement("b");
      st.textContent = setsLabel(t.sets);
      who.append(nm, st);
      place.append(pos, who);
      podium.append(place);
    });

    // nomes + sets de todos os times (no painel de configurações)
    const names = document.getElementById("namesList");
    state.teams.forEach((t, i) => {
      let row = names.children[i];
      if (!row) {
        row = document.createElement("div");
        row.className = "name-row";
        const input = document.createElement("input");
        input.maxLength = 24;
        input.addEventListener("input", e => rename(Number(e.target.dataset.id), e.target.value));
        input.addEventListener("blur", renderTexts);
        input.addEventListener("keydown", e => { if (e.key === "Enter") input.blur(); });
        const tag = document.createElement("span");
        tag.className = "tag";
        row.append(input, tag);
        names.append(row);
      }
      const input = row.querySelector("input");
      const tag = row.querySelector(".tag");
      input.dataset.id = t.id;
      input.placeholder = "Time " + t.id;
      if (document.activeElement !== input) input.value = t.name;
      row.style.setProperty("--tc", colorOf(t.id));
      const playing = state.court.includes(t.id);
      tag.className = "tag" + (playing ? " playing" : "");
      tag.textContent = playing ? "em quadra" : setsLabel(t.sets);
    });
    while (names.children.length > state.teams.length) names.lastChild.remove();
  }

  function render() {
    cards.forEach((card, side) => {
      card.querySelector(".points").textContent = state.points[side];
    });
    renderTexts();

    document.getElementById("targetValue").textContent = state.target;
    document.getElementById("teamsValue").textContent = state.teams.length;
    document.getElementById("teamsMinus").disabled = state.teams.length <= MIN_TEAMS;
    document.getElementById("teamsPlus").disabled = state.teams.length >= MAX_TEAMS;

    save();
  }

  // ===== Eventos =====
  cards.forEach((card, side) => {
    card.querySelector(".plus").addEventListener("click", () => addPoint(side));
    card.querySelector(".minus").addEventListener("click", () => removePoint(side));
    const input = card.querySelector(".team-name");
    input.maxLength = 24;
    input.addEventListener("input", e => rename(state.court[side], e.target.value));
    input.addEventListener("blur", renderTexts);
    input.addEventListener("keydown", e => { if (e.key === "Enter") input.blur(); });
  });

  document.getElementById("btnSettings").addEventListener("click", openSettings);
  document.getElementById("btnClose").addEventListener("click", closeSettings);
  sheetBg.addEventListener("click", e => { if (e.target === sheetBg) closeSettings(); });

  document.getElementById("targetMinus").addEventListener("click", () => setTarget(state.target - 1));
  document.getElementById("targetPlus").addEventListener("click", () => setTarget(state.target + 1));
  document.getElementById("teamsMinus").addEventListener("click", () => setTeamCount(state.teams.length - 1));
  document.getElementById("teamsPlus").addEventListener("click", () => setTeamCount(state.teams.length + 1));

  document.getElementById("btnWinUndo").addEventListener("click", undo);
  document.getElementById("btnWinOk").addEventListener("click", hideOverlay);

  // confirmação em dois toques
  const resetAllBtn = document.getElementById("btnResetAll");
  const resetLabel = resetAllBtn.textContent;
  let resetArmed = null;
  resetAllBtn.addEventListener("click", () => {
    if (!resetArmed) {
      resetAllBtn.textContent = "Toque de novo para confirmar";
      resetArmed = setTimeout(() => { resetAllBtn.textContent = resetLabel; resetArmed = null; }, 3000);
      return;
    }
    clearTimeout(resetArmed);
    resetArmed = null;
    resetAllBtn.textContent = resetLabel;
    snapshot();
    const ids = state.teams.map(t => t.id);
    state = {
      teams: state.teams.map(t => ({ ...t, sets: 0 })),
      nextId: state.nextId,
      court: [ids[0], ids[1]],
      points: [0, 0],
      queue: ids.slice(2),
      target: state.target,
      games: 0,
      clock: { elapsed: 0, since: null }
    };
    closeSettings();
    render();
    tick();
  });

  render();

  // ===== Cronômetro: ▶ começa a contar, ⏸ para =====
  if (!state.clock) state.clock = { elapsed: 0, since: null };
  const timerEl = document.getElementById("timer");
  const playBtn = document.getElementById("btnPlay");
  function clockMs() {
    const c = state.clock;
    return c.elapsed + (c.since ? Date.now() - c.since : 0);
  }
  function tick() {
    const total = Math.floor(clockMs() / 1000);
    const hh = Math.floor(total / 3600);
    const mm = String(Math.floor((total % 3600) / 60)).padStart(2, "0");
    const ss = String(total % 60).padStart(2, "0");
    timerEl.textContent = (hh ? hh + ":" : "") + mm + ":" + ss;
    const rodando = !!state.clock.since;
    timerEl.classList.toggle("parado", !rodando);
    playBtn.classList.toggle("rodando", rodando);
    playBtn.textContent = rodando ? "⏸" : "▶";
    playBtn.setAttribute("aria-label", rodando ? "Pausar cronômetro" : "Iniciar cronômetro");
  }
  playBtn.addEventListener("click", () => {
    const c = state.clock;
    if (c.since) { c.elapsed += Date.now() - c.since; c.since = null; } // pausa
    else { c.since = Date.now(); }                                       // começa / continua
    save();
    tick();
  });
  tick();
  setInterval(tick, 1000);

  // ===== Força o app a ficar deitado (mesmo com a rotação automática desligada) =====
  function lockLandscape() {
    try {
      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock("landscape").catch(() => {});
      }
    } catch (e) {}
  }
  lockLandscape();
  document.addEventListener("click", lockLandscape, { once: true });

  // ===== PWA: funciona offline depois de instalado =====
  if ("serviceWorker" in navigator && location.protocol === "https:") {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
</script>
</body>
</html>
